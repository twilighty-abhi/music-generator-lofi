<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lofi Generator</title>
  <style>
    :root {
      --bg: #1e1b26;
      --panel: #282433;
      --fg: #e8e2d6;
      --muted: #e8e2d6aa;
      --accent: #f2b880;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, Menlo, monospace;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 640px; }
    h1 { font-weight: 400; letter-spacing: 0.1em; text-align: center; margin: 0 0 16px; }
    h2 { font-size: 0.85rem; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; margin: 0 0 12px; }
    section { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    button, input[type="text"] {
      font: inherit;
      padding: 0.5em 1.1em;
      border: 1px solid var(--fg);
      border-radius: 999px;
      background: transparent;
      color: inherit;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #e8e2d633; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    #toggle { font-size: 1.2rem; padding: 0.6em 2em; }
    #seed { width: 9em; text-align: center; }
    #info { text-align: center; color: var(--muted); line-height: 1.8; margin-top: 12px; }
    canvas { width: 100%; height: 80px; display: block; }
    .grid { display: grid; grid-template-columns: 7em 1fr 4em; gap: 10px 12px; align-items: center; }
    .grid label { color: var(--muted); }
    .grid output { text-align: right; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .mute { padding: 0.15em 0.6em; font-size: 0.8rem; }
    .mixer { grid-template-columns: 6em 1fr 4em; }
    #download { color: var(--accent); }
    .hint { text-align: center; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <h1>lofi generator</h1>

    <section>
      <div class="row">
        <button id="toggle">▶ Play</button>
        <button id="newTrack" title="N">⟳ New track</button>
        <button id="record" title="R" disabled>● Rec</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <label for="seed">seed</label>
        <input id="seed" type="text" spellcheck="false">
        <button id="mood">mood: major</button>
      </div>
      <div id="info">
        <div>key: <span id="key">–</span> · bpm: <span id="bpmLabel">–</span> · bar: <span id="bar">–</span></div>
        <div>chord: <span id="chord">–</span> <span id="section"></span></div>
        <div><a id="download" hidden></a></div>
      </div>
    </section>

    <section>
      <canvas id="viz"></canvas>
    </section>

    <section>
      <h2>Sound</h2>
      <div class="grid" id="controls"></div>
    </section>

    <section>
      <h2>Mixer</h2>
      <div class="grid mixer" id="mixer"></div>
    </section>

    <p class="hint">space: play/stop · n: new track · r: record</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="main.js"></script>
</body>
</html>
